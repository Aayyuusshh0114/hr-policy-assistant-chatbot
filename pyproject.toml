[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hr-policy-assistant"
version = "0.1.0"
description = "A locally hosted, evidence-grounded HR policy assistant."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "faiss-cpu>=1.10,<2.0",
  "fastapi>=0.115,<1.0",
  "google-genai>=1.0,<2.0",
  "groq>=0.28,<1.0",
  "numpy>=2.0,<3.0",
  "pypdf>=6.0,<7.0",
  "pydantic-settings>=2.7,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "sentence-transformers>=5.0,<6.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "reportlab>=4.0,<5.0",
  "ruff>=0.11,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: tests that exercise multiple application layers",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["HR_Assistant_RAG.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/create_demo_policies.py" = ["E501"]
